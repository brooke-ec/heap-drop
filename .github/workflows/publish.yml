name: Publish to crates.io

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-release
        run: cargo install cargo-release
      - name: Verify workspace builds
        run: cargo build --workspace
      - name: Run tests
        run: cargo test --workspace
      - name: Publish heap-drop-macros
        run: |
          cargo release publish --workspace --package heap-drop-macros --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish heap-drop
        run: |
          cargo release publish --workspace --package heap-drop --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
